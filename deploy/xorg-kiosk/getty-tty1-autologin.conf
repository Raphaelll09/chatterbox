# Installed by scripts/setup_pi.sh to /etc/systemd/system/getty@tty1.service.d/override.conf --
# see deploy/xorg-kiosk/README.md for why plain Xorg needs a real agetty login session rather than
# chatterbox-gui.service's systemd TTYPath=/PAMName=login pattern (that pattern is what cage uses,
# and cage is not the active compositor on this deployment -- see the README).
#
# "chatterbox" below is this deployment's actual account -- adjust if reused on a Pi with a
# different deployment user (matching chatterbox-powerd.service's own WorkingDirectory).
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin chatterbox --noclear %I $TERM
