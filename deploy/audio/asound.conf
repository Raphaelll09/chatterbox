# Chatterbox kiosk: pin the ALSA system default to the IQaudio DAC HAT (the actual speaker output
# this device is wired to via chatterbox-powerd's amp SD-line control), not whichever card the
# kernel happens to enumerate first. Real-hardware bug report: "the speaker is connected but when
# I run a synthesis, it only makes noise louder" -- `aplay -l` on the affected device showed the
# onboard vc4-hdmi outputs at cards 0/1, ahead of the DAC at card 2, with no default-device
# override anywhere on the system. Anything using ALSA's bare 'default' device -- including
# chatterbox's own ffplay-based playback (chatterbox/audio/playback.py), which passes no explicit
# device -- silently went out via HDMI instead of the connected speaker. chatterbox-powerd's own
# amp GPIO handshake (chatterbox/power/amp.py) still enabled the amplifier around every playback
# regardless (it has no way to know audio went elsewhere), which is what actually produced the
# reported "noise that gets louder": an enabled amp with no real signal reaching it, not a TTS
# quality problem. Confirmed fixed live (ssh, a known-good `aplay -l`-listed ALSA test WAV played
# through chatterbox's own playback path both before and after this file existed): silence before,
# clearly audible after.
#
# Installed to /etc/asound.conf by scripts/setup_pi.sh (system-wide, not per-user --
# acceptable for a single-purpose embedded kiosk device, not a shared multi-user system, matching
# the same relaxation already made for /etc/X11/Xwrapper.config's allowed_users).
#
# `type plug` (not a raw `type hw`) wrapping the real hardware device -- handles sample-rate/
# format conversion automatically if a client (ffplay, or anything else) requests a rate/format
# the DAC doesn't support natively, instead of failing outright.
#
# Card is referenced by NAME ("IQaudIODAC", the id `aplay -l` reports for it), not by numeric
# index -- indices can shift depending on driver/module load order; the name is stable across
# reboots for a fixed HAT.
pcm.!default {
    type plug
    slave.pcm "hw:IQaudIODAC,0"
}
ctl.!default {
    type hw
    card IQaudIODAC
}
